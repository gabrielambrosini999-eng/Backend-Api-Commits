<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git Demo - Crear pull request</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/git-demo.css" rel="stylesheet">
</head>
<body>
  <nav class="topbar navbar"><div class="container-xl"><a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="repository.html"><span class="brand-mark"><i class="bi bi-git"></i></span>Git Demo</a><a class="btn btn-outline-secondary btn-sm" href="pull-requests-list.html">Pull requests</a></div></nav>
  <main class="container-xl py-4">
    <h1 class="h3">Crear pull request</h1>
    <p class="muted">Propone integrar cambios de una rama hacia otra con revision del equipo.</p>
    <form class="form-shell p-4">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label fw-semibold">Base</label><select class="form-select"><option>main</option><option>develop</option></select></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Compare</label><select class="form-select"><option>feature/email-validation</option><option>hotfix/login-timeout</option></select></div>
        <div class="col-12"><label class="form-label fw-semibold">Titulo</label><input class="form-control" placeholder="Agregar validacion de email"></div>
        <div class="col-12"><label class="form-label fw-semibold">Descripcion</label><textarea class="form-control" rows="6" placeholder="Resumen, cambios incluidos y checklist"></textarea></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Reviewer</label><select class="form-select"><option>Ana Rodriguez</option><option>Martin Silva</option></select></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Issue vinculado</label><input class="form-control" placeholder="#42"></div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="pull-requests-list.html">Cancelar</a><a class="btn btn-success" href="pull-request-detail.html">Crear pull request</a></div>
    </form>
  </main>
</body>
</html>
