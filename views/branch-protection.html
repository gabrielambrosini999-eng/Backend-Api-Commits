<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Git Demo - Branch protection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/git-demo.css" rel="stylesheet">
</head>

<body>
<nav class="topbar navbar">
    <div class="container-xl"><a class="navbar-brand d-flex align-items-center gap-2 fw-semibold"
                                 href="repository-settings.html"><span class="brand-mark"><i
            class="bi bi-git"></i></span>Git Demo</a>
    </div>
</nav>
<main class="container-xl py-4">
    <h1 class="h3">Branch protection</h1>
    <p class="muted">Reglas para proteger <code>main</code> antes de aceptar cambios.</p>

    <form class="form-shell p-4" method="POST" action="/branchprotection">

        <label class="form-label fw-semibold">Branch pattern</label>
        <input class="form-control mb-3" value="main" id="protection" name="protection">

        <div class="form-check mb-2">
            <input class="form-check-input" checked type="checkbox" id="reviews">
            <label class="form-check-label" for="reviews">Require pull request reviews before merging</label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" checked type="checkbox" id="checks">
            <label class="form-check-label" for="checks">Require status checks to pass</label>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="force">
            <label class="form-check-label" for="force">Block force pushes</label>
        </div>
        <label class="form-label fw-semibold">Required approvals</label>
        <input class="form-control mb-4" type="number" value="1">

        <button class="btn btn-success">Guardar regla</button>

    </form>
</main>
</body>

</html>
