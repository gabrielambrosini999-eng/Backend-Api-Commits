<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git Demo - Crear issue</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/git-demo.css" rel="stylesheet">
</head>
<body>
  <nav class="topbar navbar navbar-expand-lg">
    <div class="container-xl">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="repository.html"><span class="brand-mark"><i class="bi bi-git"></i></span>Git Demo</a>
      <div class="ms-auto"><a class="btn btn-outline-secondary btn-sm" href="issues-list.html"><i class="bi bi-arrow-left me-1"></i>Volver</a></div>
    </div>
  </nav>
  <main class="container-xl py-4">
    <div class="row justify-content-center">
      <section class="col-lg-8">
        <div class="mb-3">
          <h1 class="h3 mb-1">Crear issue</h1>
          <p class="muted mb-0">Registra una tarea o error con suficiente contexto para que el equipo pueda resolverlo.</p>
        </div>
        <form class="form-shell p-4">
          <div class="mb-3">
            <label class="form-label fw-semibold" for="title">Titulo</label>
            <input class="form-control" id="title" placeholder="Corregir validacion de email">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="body">Descripcion</label>
            <textarea class="form-control" id="body" rows="6" placeholder="Que pasa, que deberia pasar y como reproducirlo"></textarea>
          </div>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold" for="label">Etiqueta</label>
              <select class="form-select" id="label">
                <option>bug</option>
                <option>feature</option>
                <option>documentation</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold" for="assignee">Responsable</label>
              <select class="form-select" id="assignee">
                <option>Sin asignar</option>
                <option>Ana Rodriguez</option>
                <option>Martin Silva</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold" for="priority">Prioridad</label>
              <select class="form-select" id="priority">
                <option>Media</option>
                <option>Alta</option>
                <option>Baja</option>
              </select>
            </div>
          </div>
          <div class="d-flex justify-content-end gap-2 pt-4">
            <a class="btn btn-outline-secondary" href="issues-list.html">Cancelar</a>
            <button class="btn btn-success" type="button"><i class="bi bi-record-circle me-1"></i>Crear issue</button>
          </div>
        </form>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
