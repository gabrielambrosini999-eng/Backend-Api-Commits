<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git Demo - Ingresar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/git-demo.css" rel="stylesheet">
</head>
<body>
  <main class="container-xl py-5">
    <div class="row justify-content-center">
      <section class="col-md-7 col-lg-4">
        <div class="text-center mb-4">
          <span class="brand-mark mx-auto mb-3"><i class="bi bi-git"></i></span>
          <h1 class="h3 mb-1">Ingresar</h1>
          <p class="muted mb-0">Accede para administrar repositorios, commits e issues.</p>
        </div>

        <form class="form-shell p-4" method="POST" action="/login">
          <div class="mb-3">
            <label class="form-label fw-semibold" for="loginEmail">Email o usuario</label>
            <input class="form-control <%= errors.email ? 'is-invalid' : '' %>" id="loginEmail" placeholder="ana-dev" name="email" value="<%= old('email') %>">
            <% if (errors.email) { %>
              <div class="invalid-feedback">
                <%= errors.email.msg %>
              </div>
            <% } %>
          </div>
          <div class="mb-3">
            <div class="d-flex justify-content-between">
              <label class="form-label fw-semibold" for="loginPassword">Contrasena</label>
              <a class="small linkish" href="/password/forget">Olvide mi contrasena</a>
            </div>
            <input 
              name="password" 
              class="form-control <%= errors.password ? 'is-invalid' : '' %>" id="loginPassword" type="password" placeholder="Tu contrasena">
            <% if (errors.password) { %>
              <div class="invalid-feedback">
                <%= errors.password.msg %>
              </div>
            <% } %>
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="remember" name="remember" value="1" <%= old('remember') ? 'checked' : '' %>>
            <label class="form-check-label small" for="remember">Mantener sesion iniciada</label>
          </div>
          <button class="btn btn-success w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Ingresar</button>
        </form>
        <p class="text-center small mt-3 mb-0">Nuevo en Git Demo? <a class="linkish" href="/register">Crear cuenta</a></p>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
