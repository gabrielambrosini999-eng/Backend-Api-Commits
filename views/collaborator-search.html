<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git Demo - Buscar colaboradores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/git-demo.css" rel="stylesheet">
</head>
<body>
  <nav class="topbar navbar navbar-expand-lg">
    <div class="container-xl">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="repository.html"><span class="brand-mark"><i class="bi bi-git"></i></span>Git Demo</a>
      <div class="ms-auto"><a class="btn btn-outline-secondary btn-sm" href="collaborators-list.html"><i class="bi bi-arrow-left me-1"></i>Volver</a></div>
    </div>
  </nav>
  <main class="container-xl py-4">
    <div class="row justify-content-center">
      <section class="col-lg-8">
        <div class="mb-3">
          <h1 class="h3 mb-1">Buscar colaboradores</h1>
          <p class="muted mb-0">Encuentra usuarios por nombre, alias o email para invitarlos al repositorio.</p>
        </div>
        <form class="form-shell p-4 mb-3">
          <label class="form-label fw-semibold" for="search">Buscar usuario</label>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input class="form-control" id="search" placeholder="ana, martin, @usuario o email">
            <button class="btn btn-success" type="button">Buscar</button>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="repo">Repositorio</label>
              <select class="form-select" id="repo">
                <option>equipo/demo-git</option>
                <option>equipo/api-clientes</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="permission">Permiso sugerido</label>
              <select class="form-select" id="permission">
                <option>Read</option>
                <option selected>Write</option>
                <option>Admin</option>
              </select>
            </div>
          </div>
        </form>
        <div class="list-row p-3">
          <div class="d-flex align-items-center justify-content-between gap-3">
            <div class="d-flex align-items-center gap-3">
              <div class="avatar avatar-purple">M</div>
              <div>
                <div class="fw-semibold">Martin Silva</div>
                <div class="small muted">@martin-dev · martin@example.com</div>
              </div>
            </div>
            <button class="btn btn-outline-success btn-sm"><i class="bi bi-person-plus me-1"></i>Invitar</button>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
